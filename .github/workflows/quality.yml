name: Webora Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: |
          npm audit --json > /tmp/webora-npm-audit.json || true
          node -e "const report = require('/tmp/webora-npm-audit.json'); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', fix=' + JSON.stringify(item.fixAvailable));"
      - name: Run core tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
